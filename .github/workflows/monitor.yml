name: Flight monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Запуск держится ~9 минут: бот отвечает на команды почти сразу,
    # а следующий запуск по cron ждёт в очереди (concurrency) и стартует следом.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check flight
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FLIGHT_NUMBER: ${{ vars.FLIGHT_NUMBER || 'WZ 709' }}
          FLIGHT_DATE: ${{ vars.FLIGHT_DATE }}
          RUN_SECONDS: 540
        run: node monitor.mjs

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git add state.json
          if git diff --cached --quiet; then
            echo "State unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update flight state"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

      # Cron в GitHub запаздывает и пропускает запуски, поэтому каждый запуск
      # сам ставит следующий в очередь (concurrency держит их по одному).
      # Цепочка обрывается, когда рейс улетел.
      - name: Schedule next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f state.json ] && grep -q '"finished": true' state.json; then
            echo "Flight departed, not scheduling next run"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            gh workflow run monitor.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}" && exit 0
            sleep $((i * 10))
          done
          exit 1
